<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8"><meta name="viewport" content="width=device-width, initial-scale=1">
<title>Ms. Financial Solutions — Set your password</title>
<link rel="icon" type="image/png" href="/logo-mark.png"/>
<style>
  body{margin:0;min-height:100vh;display:flex;align-items:center;justify-content:center;
    background:radial-gradient(1200px 600px at 70% -10%,#3a1228 0%,#191A1F 55%,#0d0d11 100%);
    font-family:'Segoe UI',system-ui,sans-serif;color:#fff}
  .card{background:rgba(255,255,255,.04);border:1px solid rgba(224,191,184,.25);border-radius:18px;
    padding:44px 40px;width:360px;text-align:center;backdrop-filter:blur(8px);box-shadow:0 30px 60px rgba(0,0,0,.5)}
  img{width:190px;margin-bottom:10px}
  h1{font-size:15px;font-weight:600;letter-spacing:.18em;color:#E0BFB8;margin:0 0 10px;text-transform:uppercase}
  p.hint{font-size:12.5px;color:rgba(255,255,255,.6);margin:0 0 22px;line-height:1.5}
  input{width:100%;box-sizing:border-box;padding:13px 16px;border-radius:10px;border:1px solid rgba(255,255,255,.15);
    background:rgba(0,0,0,.35);color:#fff;font-size:15px;outline:none;margin-bottom:14px}
  input:focus{border-color:#FF2E9A}
  button{width:100%;padding:13px;border:none;border-radius:10px;font-size:15px;font-weight:700;cursor:pointer;
    background:linear-gradient(90deg,#FF2E9A,#B76E79);color:#fff;letter-spacing:.05em}
  button:hover{filter:brightness(1.12)}
  button:disabled{opacity:.6;cursor:default}
  .err{color:#ff6b9d;font-size:13px;min-height:18px;margin-top:10px}
  .ok{color:#7ee8a8;font-size:13px;min-height:18px;margin-top:10px}
</style>
</head>
<body>
  <div class="card">
    <img src="/logo.png" alt="Ms. Financial Solutions">
    <h1>Set your password</h1>
    <p class="hint" id="hint">Choose a password for your Command Center login. At least 8 characters.</p>
    <form id="f">
      <input type="password" id="pw" placeholder="New password" autocomplete="new-password">
      <input type="password" id="pw2" placeholder="Confirm password" autocomplete="new-password">
      <button id="btn">Set password & sign in</button>
      <div class="err" id="err"></div>
      <div class="ok" id="ok"></div>
    </form>
  </div>
<script>
const params = new URLSearchParams(location.search);
const token = params.get('token');
if (!token) {
  document.getElementById('hint').textContent = 'This link is missing its token — ask your admin to send you a fresh one.';
  document.getElementById('f').style.display = 'none';
}
document.getElementById('f').addEventListener('submit', async e => {
  e.preventDefault();
  const err = document.getElementById('err'), ok = document.getElementById('ok'), btn = document.getElementById('btn');
  err.textContent = ''; ok.textContent = '';
  const pw = document.getElementById('pw').value, pw2 = document.getElementById('pw2').value;
  if (pw.length < 8) { err.textContent = 'Password must be at least 8 characters'; return; }
  if (pw !== pw2) { err.textContent = "Passwords don't match"; return; }
  btn.disabled = true; btn.textContent = 'Setting password…';
  try {
    const r = await fetch('/api/set-password', { method: 'POST', headers: { 'Content-Type': 'application/json' },
      body: JSON.stringify({ token, password: pw }) });
    const d = await r.json();
    if (!r.ok) { err.textContent = d.error || 'Something went wrong — try again or ask your admin for a new link.'; btn.disabled = false; btn.textContent = 'Set password & sign in'; return; }
    ok.textContent = 'Password set — taking you in…';
    setTimeout(() => location.href = '/', 700);
  } catch (e) {
    err.textContent = 'Network error — try again.'; btn.disabled = false; btn.textContent = 'Set password & sign in';
  }
});
</script>
</body>
</html>
