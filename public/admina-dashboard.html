<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<title>Dashboard — Admina</title>
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<link rel="stylesheet" href="/admina-assets/css/lib/bootstrap.min.css">
<link rel="stylesheet" href="/admina-assets/css/lib/apexcharts.css">
<link rel="stylesheet" href="/admina-assets/css/remixicon.css">
<link rel="stylesheet" href="/admina-assets/css/style.css">
<script src="https://cdn.jsdelivr.net/npm/@phosphor-icons/web@2.1.2"></script>
<script src="/admina-assets/js/lib/iconify-icon.min.js"></script>
<style>
  html,body{background:#f4f6fa;margin:0;height:100%;overflow:hidden}
  body{padding:20px;box-sizing:border-box}
  /* Each KPI tile needs to read as its own floating card, not one big
     bordered container -- Bootstrap's row gutter alone doesn't do that
     when both the card and the gutter are the same white as the page,
     so nothing was visually distinguishable. A soft shadow + hairline
     border on the card, against a light gray canvas (matching the main
     app's --bg), makes each tile pop independently. */
  .bg-base.radius-20{box-shadow:0 1px 2px rgba(16,24,40,.04),0 1px 6px rgba(16,24,40,.06);border:1px solid rgba(16,24,40,.05)}

  /* Single-card mode (?card=total-income|enrolled|actives|upgraded): each
     KPI now lives in its own grid-stack-item on the dashboard so Tiffany
     can drag/resize them independently like every other card, instead of
     all 4 being trapped together inside one iframe/grid cell. This iframe
     is reused per-card via the query param rather than shipping 4 near-
     identical HTML files -- same real Admina markup/charts either way.

     Everything below this point is the fix for "the card doesn't adjust,
     details inside stay the same size" -- in single-card mode the iframe's
     own viewport IS exactly the grid card's rendered size (the iframe
     element is width:100%;height:100% of its grid-stack-item, see
     index.html), so vw/vh units here are a direct, live readout of
     however big or small Tiffany just made the card. Padding/font-size/
     spacing all use clamp(min, vw/vh-based, max) instead of Bootstrap's
     fixed p-24/text-2xl/etc, so the whole tile actually shrinks and
     grows with the card instead of overflowing into a scrollbar. */
  body.single-card{padding:0;height:100vh;overflow:hidden}
  body.single-card [data-card]{display:none}
  body.single-card [data-card].adm-active{display:flex;height:100%;width:100%}
  /* The .col-sm-6.col-lg-3 Bootstrap grid classes on each [data-card]
     wrapper give it a width based on breakpoint percentages of the
     iframe's own viewport (25% at >=992px, 50% at >=576px, discrete
     jumps otherwise) -- completely decoupled from the actual card
     size GridStack just set. That's why .bg-base's measured width
     could stay pinned around 335px even after the card was dragged
     much wider: Bootstrap's breakpoint math, not the real card size,
     was deciding it. Force the wrapper to always be the iframe's
     full width in single-card mode so .bg-base (and therefore the
     --kpi-scale measurement above) tracks the actual card size. */
  body.single-card [data-card].adm-active{width:100%;max-width:100%;flex:0 0 100%}
  body.single-card .dashboard-main-body,body.single-card .row,body.single-card .col-xxl-12{height:100%}
  /* --kpi-scale is set by JS (see the ResizeObserver near the bottom of
     this file) from the card's OWN measured growth relative to however
     big it was when this iframe first loaded -- not from vw/vh. The
     earlier vw/vh clamp() version capped out almost immediately because
     the max bound was tuned so close to the default card's own vw value
     that there was no real room left to grow: drag the card twice as
     big and the text stayed exactly the size it started at. calc() off
     an actual measured scale factor has no such ceiling problem -- a
     card twice as wide genuinely gets a font size around twice as big,
     clamped only at sane floor/ceiling extremes so it never disappears
     or blows past the card. */
  body.single-card .bg-base{height:100%;width:100%;box-sizing:border-box;display:flex;flex-direction:column;overflow:hidden;
    padding:clamp(8px,calc(16px * var(--kpi-scale,1)),48px)}
  body.single-card .kpi-head{flex:0 0 auto;display:flex;align-items:center;justify-content:space-between;gap:8px;
    padding-bottom:clamp(4px,calc(14px * var(--kpi-scale,1)),40px);margin-bottom:clamp(4px,calc(14px * var(--kpi-scale,1)),40px)}
  body.single-card .kpi-head span.text-neutral-700{font-size:clamp(10px,calc(13px * var(--kpi-scale,1)),26px);white-space:nowrap;overflow:hidden;text-overflow:ellipsis}
  body.single-card .kpi-body{flex:1 1 auto;min-height:0;display:flex;align-items:center;justify-content:space-between;gap:8px}
  body.single-card .kpi-text{min-width:0;flex:1 1 auto}
  body.single-card .kpi-text h2{font-size:clamp(15px,calc(26px * var(--kpi-scale,1)),72px)!important;line-height:1.1;white-space:nowrap;overflow:hidden;text-overflow:ellipsis}
  body.single-card .kpi-text .mt-16{margin-top:clamp(2px,calc(10px * var(--kpi-scale,1)),28px)!important;white-space:nowrap;overflow:hidden;text-overflow:ellipsis}
  body.single-card .kpi-text .mt-16 span,body.single-card .kpi-text .mt-16 i{font-size:clamp(8px,calc(12px * var(--kpi-scale,1)),22px)}
  body.single-card .kpi-chart{flex:0 1 auto;max-width:42%;min-width:0}
  body.single-card .kpi-chart>div{width:100%!important}
  /* Below a certain card size the dropdown "..." menu button just eats
     space nothing else needs -- hide it rather than let it force an
     overflow; it has no real menu items wired anyway (decorative, same
     as the real Admina template ships it). */
  body.single-card .kpi-head .dropdown{flex:0 0 auto}
</style>
</head>
<body>
<script>
(function(){
  var card = new URLSearchParams(location.search).get('card');
  if(card){
    document.documentElement.classList.add('single-card-html');
    document.addEventListener('DOMContentLoaded', function(){
      document.body.classList.add('single-card');
      var el = document.querySelector('[data-card="'+card+'"]');
      if(el) el.classList.add('adm-active');
    });
  }
})();
</script>

<div class="dashboard-main-body" style="padding:0">
  <div class="row g-20-px">
    <div class="col-xxl-12">
      <div class="row g-20-px">

        <div class="col-sm-6 col-lg-3" data-card="total-income">
          <div class="bg-base p-24 radius-20 h-100">
            <div class="kpi-head d-flex align-items-center justify-content-between gap-8 pb-20 mb-20 border-bottom border-neutral-200">
              <span class="text-neutral-700 fw-medium">Total income</span>
              <div class="dropdown">
                <button type="button" data-bs-toggle="dropdown" aria-expanded="false">
                  <iconify-icon icon="entypo:dots-three-vertical" class="icon text-secondary-light"></iconify-icon>
                </button>
              </div>
            </div>
            <div class="kpi-body d-flex align-items-center justify-content-between gap-8">
              <div class="kpi-text">
                <h2 class="text-2xl mb-0" id="admTotalIncome">$0</h2>
                <div class="mt-16" id="admTotalIncomeTrend">
                  <span class="text-primary-600 text-lg line-height-1"><i class="ph ph-arrow-up"></i></span>
                  <span class="text-primary-600 fw-medium">Commas + MFSN</span>
                </div>
              </div>
              <div class="kpi-chart"><div id="barChart"></div></div>
            </div>
          </div>
        </div>

        <div class="col-sm-6 col-lg-3" data-card="enrolled">
          <div class="bg-base p-24 radius-20 h-100">
            <div class="kpi-head d-flex align-items-center justify-content-between gap-8 pb-20 mb-20 border-bottom border-neutral-200">
              <span class="text-neutral-700 fw-medium">Enrolled members</span>
              <div class="dropdown">
                <button type="button" data-bs-toggle="dropdown" aria-expanded="false">
                  <iconify-icon icon="entypo:dots-three-vertical" class="icon text-secondary-light"></iconify-icon>
                </button>
              </div>
            </div>
            <div class="kpi-body d-flex align-items-center justify-content-between gap-8">
              <div class="kpi-text">
                <h2 class="text-2xl mb-0">1,493</h2>
                <div class="mt-16">
                  <span class="text-warning-600 text-lg line-height-1"><i class="ph ph-arrows-down-up"></i></span>
                  <span class="text-warning-600 fw-medium">14% active monitoring</span>
                </div>
              </div>
              <div class="kpi-chart" style="width:140px">
                <div class="remove-tooltip-title rounded-tooltip-value"><div id="lineChart"></div></div>
              </div>
            </div>
          </div>
        </div>

        <div class="col-sm-6 col-lg-3" data-card="actives">
          <div class="bg-base p-24 radius-20 h-100">
            <div class="kpi-head d-flex align-items-center justify-content-between gap-8 pb-20 mb-20 border-bottom border-neutral-200">
              <span class="text-neutral-700 fw-medium">New portal actives</span>
              <div class="dropdown">
                <button type="button" data-bs-toggle="dropdown" aria-expanded="false">
                  <iconify-icon icon="entypo:dots-three-vertical" class="icon text-secondary-light"></iconify-icon>
                </button>
              </div>
            </div>
            <div class="kpi-body d-flex align-items-center justify-content-between gap-8">
              <div class="kpi-text">
                <h2 class="text-2xl mb-0">736</h2>
                <div class="mt-16">
                  <span class="text-warning-600 text-lg line-height-1"><i class="ph ph-arrow-up-right"></i></span>
                  <span class="text-warning-600 fw-medium">60% of target</span>
                </div>
              </div>
              <div class="kpi-chart"><div id="radialChart" class="m--8-px" style="min-width:60px; min-height:60px;"></div></div>
            </div>
          </div>
        </div>

        <div class="col-sm-6 col-lg-3" data-card="upgraded">
          <div class="bg-base p-24 radius-20 h-100">
            <div class="kpi-head d-flex align-items-center justify-content-between gap-8 pb-20 mb-20 border-bottom border-neutral-200">
              <span class="text-neutral-700 fw-medium">Upgraded</span>
              <div class="dropdown">
                <button type="button" data-bs-toggle="dropdown" aria-expanded="false">
                  <iconify-icon icon="entypo:dots-three-vertical" class="icon text-secondary-light"></iconify-icon>
                </button>
              </div>
            </div>
            <div class="kpi-body d-flex align-items-center justify-content-between gap-8">
              <div class="kpi-text">
                <h2 class="text-2xl mb-0">420</h2>
                <div class="mt-16">
                  <span class="text-danger-600 text-lg line-height-1"><i class="ph ph-arrow-down"></i></span>
                  <span class="text-danger-600 fw-medium">28% on new platform</span>
                </div>
              </div>
              <div class="kpi-chart" style="width:140px"><div id="columnChart"></div></div>
            </div>
          </div>
        </div>

      </div>
    </div>
  </div>
</div>

<script src="/admina-assets/js/lib/bootstrap.bundle.min.js"></script>
<script src="/admina-assets/js/lib/apexcharts.min.js"></script>
<script>
function getCssVar(name){ return getComputedStyle(document.documentElement).getPropertyValue(name).trim(); }
var primaryColor = getCssVar('--primary-600') || '#4F46E5';
var trackColor   = getCssVar('--primary-100') || '#BFDCFF';
var warningColor = getCssVar('--warning-600') || '#F59E0B';
var dangerColor  = getCssVar('--danger-600')  || '#DC2626';

fetch('/api/dashboard').then(function(r){ return r.json(); }).then(function(d){
  var el = document.getElementById('admTotalIncome');
  if(el && d && d.kpis) el.textContent = '$' + Math.round(d.kpis.revenueTotal).toLocaleString();
}).catch(function(){});

var barChart = new ApexCharts(document.querySelector("#barChart"), {
  series: [{ data: [543648,87000,72000,62000,48000,33129,29100].map(function(v){return Math.round(v/1000);}) }],
  chart: { type: "bar", height: 80, width: 130, sparkline: { enabled: true } },
  plotOptions: { bar: { columnWidth: "65%", borderRadius: 3 } },
  colors: [primaryColor],
  fill: { opacity: [0.35,0.35,0.35,0.35,0.35,0.35,1] },
  dataLabels: { enabled: false }, tooltip: { enabled: false }
});
barChart.render();

var lineChart = new ApexCharts(document.querySelector("#lineChart"), {
  series: [{ data: [1210,1265,1301,1340,1375,1402,1430,1448,1461,1472,1483,1489,1493] }],
  chart: { type: "area", height: 80, sparkline: { enabled: true } },
  stroke: { curve: "smooth", width: 2 },
  fill: { type: "gradient", gradient: { opacityFrom: 0.4, opacityTo: 0 } },
  colors: [primaryColor], tooltip: { enabled: true }
});
lineChart.render();

var radialChart = new ApexCharts(document.querySelector("#radialChart"), {
  series: [Math.round(736/1226*100)],
  chart: { type: "radialBar", height: 90, width: 90, sparkline: { enabled: true } },
  plotOptions: { radialBar: { startAngle:0, endAngle:360, hollow:{size:"70%"},
    track:{background:trackColor,strokeWidth:"100%",margin:0},
    dataLabels:{ name:{show:false}, value:{ fontSize:"12px", fontWeight:500, color:warningColor, offsetY:0, show:true, formatter:function(v){return v+"%";} } } } },
  fill: { colors: [warningColor] }, stroke: { lineCap: "round" }, labels: ["New portal actives"]
});
radialChart.render();

var columnChart = new ApexCharts(document.querySelector("#columnChart"), {
  series: [{ data: [30,55,80,120,180,260,340,420].map(function(v){return v;}) }],
  chart: { type: "bar", height: 80, sparkline: { enabled: true } },
  plotOptions: { bar: { columnWidth: "40%", borderRadius: 3 } },
  colors: [dangerColor],
  fill: { opacity: [1,0.3,1,0.3,1,0.3,1,1] },
  dataLabels: { enabled: false }, tooltip: { enabled: false }
});
columnChart.render();

// The vw/vh clamp() rules above handle the text/padding side of "the card
// doesn't adjust when resized" -- this handles the chart side. ApexCharts
// only re-measures its own canvas on the iframe's window 'resize' event,
// which normally fires when the *browser* window changes size -- but here
// the iframe's rendered size changes because the GridStack card around it
// was dragged/resized, which doesn't reliably fire that event in every
// browser. A ResizeObserver on the actual visible card watches its real
// pixel size directly and nudges each chart to redraw at the new size,
// so shrinking or growing the card via "Customize layout" actually
// resizes the chart instead of leaving it at whatever size it first
// rendered at.
if(window.ResizeObserver){
  var chartsByCard = {
    'total-income': [barChart],
    'enrolled': [lineChart],
    'actives': [radialChart],
    'upgraded': [columnChart]
  };
  var baseline = {}; // first-measured size per card, the "scale:1" reference
  Object.keys(chartsByCard).forEach(function(card){
    var el = document.querySelector('[data-card="'+card+'"] .bg-base');
    if(!el) return;
    var ro = new ResizeObserver(function(entries){
      var box = entries[0].contentRect, w = box.width, h = box.height;
      if(w<=0||h<=0) return;
      if(!baseline[card]) baseline[card] = {w:w, h:h};
      // Scale off whichever dimension grew/shrank less, so text never
      // outgrows a card that only got taller (or only got wider) --
      // same idea as object-fit:contain instead of stretching to fill.
      var scale = Math.min(w/baseline[card].w, h/baseline[card].h);
      scale = Math.max(0.55, Math.min(scale, 3));
      el.style.setProperty('--kpi-scale', scale);
      chartsByCard[card].forEach(function(ch){ if(ch && ch.windowResizeHandler) ch.windowResizeHandler(); });
    });
    ro.observe(el);
  });
}
</script>
</body>
</html>
